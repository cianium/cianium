<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Kian Khayat — The Builder's Command Center</title>
<desc id="desc">Original futuristic profile banner in midnight navy, electric cyan and violet, with a circuit orbit, grid and signature.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060b15"/><stop offset=".56" stop-color="#0a1729"/><stop offset="1" stop-color="#100d22"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1de5d4"/><stop offset=".55" stop-color="#568aff"/><stop offset="1" stop-color="#a16cff"/></linearGradient>
 <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22edd4"/><stop offset=".48" stop-color="#64baff"/><stop offset="1" stop-color="#a68aff"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#2960ab" stop-opacity=".25"/><stop offset="1" stop-color="#2960ab" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8bacff" stroke-opacity=".085" stroke-width=".8"/></pattern>
 <clipPath id="panel"><rect x="1" y="1" width="1198" height="428" rx="22"/></clipPath>
 <style>
 .orb{transform-origin:946px 213px;animation:orbit 36s linear infinite}
 .orb2{transform-origin:946px 213px;animation:orbit 27s linear infinite reverse}
 .pulse{animation:pulse 2.5s ease-in-out infinite}
 .trace{stroke-dasharray:16 18;animation:drift 15s linear infinite}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
 @keyframes drift{to{stroke-dashoffset:-400}}
 @media (prefers-reduced-motion: reduce){.orb,.orb2,.pulse,.trace{animation:none}}
 </style>
</defs>
<g clip-path="url(#panel)">
 <rect width="1200" height="430" fill="url(#bg)"/>
 <rect width="1200" height="430" fill="url(#grid)"/>
 <circle cx="925" cy="203" r="325" fill="url(#halo)"/>
 <path d="M0 347H1200" stroke="#9baced" stroke-opacity=".14"/>
 <path d="M0 72H1200" stroke="#9baced" stroke-opacity=".14"/>
 <path d="M32 36h130" stroke="#20e2d5" stroke-width="3" stroke-linecap="round"/>
 <path d="M1066 394h110" stroke="#946cff" stroke-width="3" stroke-linecap="round"/>
 <path d="M592 0V430" stroke="#7ca4f5" stroke-opacity=".11" stroke-dasharray="3 10"/>
 <path d="M652 70 720 108 850 108" fill="none" stroke="#3aa9df" stroke-opacity=".22"/>
 <path d="M670 346 750 307 826 307" fill="none" stroke="#3aa9df" stroke-opacity=".22"/>
 <circle cx="850" cy="108" r="3" fill="#5de3f5"/>
 <circle cx="826" cy="307" r="3" fill="#b38bff"/>
 <text x="36" y="59" font-family="monospace" font-weight="700" font-size="14" letter-spacing="2.5" fill="#6de8db">C /</text>
 <text x="99" y="59" font-family="monospace" font-size="13" letter-spacing="2" fill="#a1b9d2">CIANIUM // ENGINEERING LOG</text>
 <circle cx="996" cy="40" r="5" fill="#25dcc0" class="pulse"/>
 <text x="1012" y="45" font-family="monospace" font-size="12" fill="#b5c8de">ACTIVE / 2026</text>
 <g font-family="Arial, Helvetica, sans-serif" font-weight="800" letter-spacing="-4">
  <text x="54" y="192" font-size="113" fill="#eef7ff">KIAN</text>
  <text x="53" y="290" font-size="100" fill="url(#word)">KHAYAT<tspan fill="#e6f0ff">.</tspan></text>
 </g>
 <text x="59" y="323" font-family="monospace" font-size="15" letter-spacing="1.4" fill="#c8d6eb">BUILDER OF IDEAS / STUDENT OF SYSTEMS</text>
 <g font-family="monospace" font-size="11" font-weight="700">
  <rect x="54" y="365" rx="8" width="124" height="32" fill="#1ce6cd" fill-opacity=".10" stroke="#1ce6cd" stroke-opacity=".55"/>
  <text x="72" y="386" fill="#87f9e6">01 / BUILD</text>
  <rect x="188" y="365" rx="8" width="124" height="32" fill="#6093ff" fill-opacity=".10" stroke="#6093ff" stroke-opacity=".55"/>
  <text x="206" y="386" fill="#a8c6ff">02 / TEST</text>
  <rect x="322" y="365" rx="8" width="140" height="32" fill="#b47aff" fill-opacity=".10" stroke="#b47aff" stroke-opacity=".55"/>
  <text x="339" y="386" fill="#dbc3ff">03 / ITERATE</text>
 </g>
 <g>
  <circle cx="946" cy="213" r="179" fill="none" stroke="#9ab8ff" stroke-opacity=".10"/>
  <circle cx="946" cy="213" r="149" fill="none" stroke="#6fb3f9" stroke-opacity=".30" stroke-dasharray="3 10"/>
  <circle cx="946" cy="213" r="111" fill="none" stroke="#1be1da" stroke-opacity=".18"/>
  <circle cx="946" cy="213" r="80" fill="#0c1f34" fill-opacity=".8" stroke="#2dd8de" stroke-opacity=".55" stroke-width="1.6"/>
  <g class="orb">
   <ellipse cx="946" cy="213" rx="167" ry="61" fill="none" stroke="url(#edge)" stroke-width="1.6" transform="rotate(-30 946 213)"/>
   <circle cx="808" cy="263" r="6" fill="#1ef3d9"/>
  </g>
  <g class="orb2">
   <ellipse cx="946" cy="213" rx="128" ry="78" fill="none" stroke="#728bff" stroke-opacity=".7" transform="rotate(58 946 213)"/>
   <circle cx="1056" cy="176" r="5" fill="#b58dff"/>
  </g>
  <circle cx="946" cy="213" r="53" fill="#152840" stroke="#b9d6ff" stroke-opacity=".42"/>
  <path d="M928 198l-14 15 14 15m36-30 14 15-14 15m-5-39-14 59" fill="none" stroke="url(#edge)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M786 213h-27m372 0h-27M946 52V25m0 376v-27" stroke="#7cbce5" stroke-opacity=".38" stroke-width="1.2"/>
  <circle cx="946" cy="213" r="194" fill="none" stroke="#4582ff" stroke-opacity=".3" stroke-dasharray="3 20" class="trace"/>
  <text x="784" y="77" font-family="monospace" font-size="12" letter-spacing="2" fill="#70f2e4">DESIGN SYSTEMS</text>
  <text x="1031" y="348" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#c1a5ff">SHIP IDEAS</text>
 </g>
 <rect x="1" y="1" width="1198" height="428" rx="22" fill="none" stroke="url(#edge)" stroke-opacity=".50" stroke-width="2"/>
</g>
</svg>